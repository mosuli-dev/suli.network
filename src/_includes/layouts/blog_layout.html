---
layout: layouts/base_layout.html
---

<article>
  <h1>{{ title }}</h1>

  <p>
    <time datetime="{{ page.date }}">
      {{ page.date | date: "%m-%d-%y" }}
    </time>
  </p>
  
  {% if tags %}
    <p>Tags:
      {% for tag in tags %}
        <a href="/tags/{{ tag }}/">{{ tag }}</a>
      {% endfor %}
    </p>
  {% endif %}
  
  {{ content }}


  <p><a href="/blog/">← back</a></p>
</article>
