---
layout: layouts/base_layout.html
---

<article id="blog-post">
  <h1>{{ title }}</h1>
  <h2>
    <time datetime="{{ page.date }}">
      {{ page.date | date: "%b %d, %Y" }}
    </time>
  </h2>
  {% if tags %}
  <i>
    <small class="subtext">
      Tags:
      {% for tag in tags %}
      <a href="/tags/{{ tag }}/">{{ tag }}</a>
      {% endfor %}
    </small>
  </i>
  {% endif %}
  
  {{ content }}
  
  
  <p><a href="/blog/">← back</a></p>
</article>
