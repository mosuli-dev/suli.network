---
layout: layouts/base_layout.html
---

<article>
  <h1>{{ title }}</h1>

  <p>
    <time datetime="{{ page.date }}">
      {{ page.date }}
    </time>
  </p>

  {{ content }}

  {% if tags %}
    <p>Tags:
      {% for tag in tags %}
        <a href="/tags/{{ tag }}/">{{ tag }}</a>
      {% endfor %}
    </p>
  {% endif %}

  <p><a href="/blog/">← Back to blog</a></p>
</article>
